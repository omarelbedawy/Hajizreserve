name: 15-Min Flight Check Cron

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes automatically via GitHub
  workflow_dispatch:        # Allows manual triggers from GitHub UI

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hajiz Cron Endpoint
        run: |
          curl -s https://your-app-name.vercel.app/api/cron-check